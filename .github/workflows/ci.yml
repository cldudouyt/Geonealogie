name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test
        env:
          AUTH_SECRET: ci-test-secret-minimum-32-characters
          AUTH_PASSWORD: ci-test-password

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-test-secret-minimum-32-characters
          AUTH_PASSWORD: ci-test-password
          # DATABASE_URL absent → fallback fichier local
          # GEMINI_API_KEY absent → features IA désactivées silencieusement
          # BLOB_READ_WRITE_TOKEN absent → stockage local
